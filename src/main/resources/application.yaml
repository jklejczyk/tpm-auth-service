spring:
  application:
    name: tpm-auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5437/auth_db}
    username: ${SPRING_DATASOURCE_USERNAME:auth_user}
    password: ${SPRING_DATASOURCE_PASSWORD:auth}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

tpm:
  jwt:
    private-key-location: ${TPM_JWT_PRIVATE_KEY_LOCATION:file:../tpm-platform/keys/private.pem}
    issuer: ${TPM_JWT_ISSUER:tpm-auth-service}
    ttl: ${TPM_JWT_TTL:PT30M}

logging:
  pattern:
    console: "%d{HH:mm:ss} %-5level [%X{correlationId}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health
